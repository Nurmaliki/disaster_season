<!doctype html>
<html lang="id" class="h-full">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

		<!--
			No secret or environment value is ever rendered here.
			All external API access happens server-side through /api/* gateway routes.
		-->
		<meta name="theme-color" media="(prefers-color-scheme: light)" content="#f8fafc" />
		<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0b1220" />
		<meta name="color-scheme" content="light dark" />

		<meta
			name="description"
			content="Pemantauan cuaca, musim, peringatan dini, gempa bumi, gunung api, dan bencana Indonesia berdasarkan sumber data resmi BMKG, BNPB, dan PVMBG."
		/>
		<meta name="format-detection" content="telephone=no" />

		<link rel="manifest" href="/manifest.webmanifest" />
		<link rel="apple-touch-icon" href="/icons/icon-192.png" />

		<!-- Prevent the pre-hydration flash of the wrong theme. -->
		<script>
			(function () {
				try {
					var stored = localStorage.getItem('idm-theme');
					var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
					var dark = stored ? stored === 'dark' : prefersDark;
					document.documentElement.classList.toggle('dark', dark);
					document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
				} catch (e) {
					/* ignore */
				}
			})();
		</script>

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" class="h-full">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
